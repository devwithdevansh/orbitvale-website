<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#081209"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ff3d0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7ff3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="560" height="360" fill="url(#bg)"/>
  <ellipse cx="280" cy="180" rx="180" ry="100" fill="url(#glow)" filter="url(#blur)"/>
  <!-- orbit rings -->
  <ellipse cx="280" cy="180" rx="120" ry="40" fill="none" stroke="#7ff3d0" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <ellipse cx="280" cy="180" rx="80" ry="26" fill="none" stroke="#7ff3d0" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <ellipse cx="280" cy="180" rx="45" ry="15" fill="none" stroke="#7ff3d0" stroke-width="0.6" stroke-opacity="0.2"/>
  <!-- data nodes on rings -->
  <circle cx="400" cy="180" r="4" fill="#7ff3d0" fill-opacity="0.9"/>
  <circle cx="160" cy="180" r="3" fill="#7ff3d0" fill-opacity="0.6"/>
  <circle cx="280" cy="140" r="3.5" fill="#7ff3d0" fill-opacity="0.7"/>
  <circle cx="280" cy="220" r="2.5" fill="#7ff3d0" fill-opacity="0.5"/>
  <!-- center db -->
  <rect x="263" y="168" width="34" height="24" rx="4" fill="none" stroke="#7ff3d0" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="263" y1="176" x2="297" y2="176" stroke="#7ff3d0" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="263" y1="184" x2="297" y2="184" stroke="#7ff3d0" stroke-width="0.6" stroke-opacity="0.5"/>
  <text x="32" y="52" font-family="ui-monospace,monospace" font-size="9" letter-spacing="0.25em" fill="#7ff3d0" fill-opacity="0.7">ORBITDB</text>
  <text x="32" y="330" font-family="ui-monospace,monospace" font-size="8" letter-spacing="0.18em" fill="#ffffff" fill-opacity="0.25">03 / DECENTRALIZED DB</text>
</svg>
