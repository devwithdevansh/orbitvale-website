<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f4fff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#3f7dff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3f7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="560" height="360" fill="url(#bg)"/>
  <ellipse cx="340" cy="140" rx="200" ry="130" fill="url(#nebula)" filter="url(#blur1)"/>
  <ellipse cx="380" cy="120" rx="80" ry="55" fill="url(#core)" filter="url(#blur2)"/>
  <!-- content nodes -->
  <circle cx="340" cy="130" r="3" fill="#c084fc" fill-opacity="0.9"/>
  <circle cx="280" cy="170" r="2" fill="#7f4fff" fill-opacity="0.7"/>
  <circle cx="410" cy="100" r="1.5" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="450" cy="160" r="2" fill="#3f7dff" fill-opacity="0.6"/>
  <circle cx="300" cy="90" r="1.5" fill="#c084fc" fill-opacity="0.4"/>
  <!-- connector lines -->
  <line x1="340" y1="130" x2="280" y2="170" stroke="#7f4fff" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="340" y1="130" x2="410" y2="100" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="340" y1="130" x2="450" y2="160" stroke="#3f7dff" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="340" y1="130" x2="300" y2="90" stroke="#c084fc" stroke-width="0.5" stroke-opacity="0.25"/>
  <text x="32" y="52" font-family="ui-monospace,monospace" font-size="9" letter-spacing="0.25em" fill="#c084fc" fill-opacity="0.7">NEBULA CMS</text>
  <text x="32" y="330" font-family="ui-monospace,monospace" font-size="8" letter-spacing="0.18em" fill="#ffffff" fill-opacity="0.25">02 / HEADLESS CMS</text>
</svg>
