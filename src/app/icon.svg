<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#08090b"/>
  <!-- Outer orbital ellipse, tilted -13° -->
  <ellipse cx="16" cy="16" rx="13" ry="5.5"
    stroke="#7ff3d0" stroke-width="1.5" stroke-linecap="round"
    transform="rotate(-13 16 16)" opacity="0.9"/>
  <!-- Inner core -->
  <circle cx="16" cy="16" r="3.5" fill="#7ff3d0" opacity="0.85"/>
  <!-- Orbital dot at leading edge -->
  <circle cx="27.4" cy="13.4" r="1.8" fill="#ffb86b" opacity="0.9"/>
</svg>
